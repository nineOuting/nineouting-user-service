# user-service 로컬 개발용 의존 서비스.
#   docker compose up -d   → 이후 IDE나 ./gradlew bootRun --args='--spring.profiles.active=local' 로 서비스 실행
# 서비스 전체를 함께 띄우는 통합 테스트는 nineouting-docs/integration 에서 한다.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-user_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-user_service}
    ports:
      - "5433:5432"   # 이 PC에 설치된 PostgreSQL(5432)과 겹치지 않게
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user_service", "-d", "user_db"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.1   # KRaft 단일 브로커, localhost:9092
    ports:
      - "9092:9092"

  s3:
    # 로컬용 S3 (프로필 사진). MinIO는 공식 이미지 배포가 중단되어 LocalStack을 쓴다.
    image: localstack/localstack:4.4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro

volumes:
  postgres-data:
