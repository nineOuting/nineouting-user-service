plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nineouting.backend'
version = '0.0.1'

ext {
    commonVersion = '0.8.0'
    jjwtVersion = '0.12.6'
    awsSdkVersion = '2.55.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // 공통 모듈(nineouting-common) — GitHub Packages는 public이어도 읽을 때 토큰이 필요하다.
    //  - CI: GITHUB_ACTOR + GPR_TOKEN (조직 시크릿, read:packages)
    //  - 로컬: ~/.gradle/gradle.properties 의 gpr.user / gpr.key
    maven {
        url = uri('https://maven.pkg.github.com/nineOuting/nineouting-common')
        credentials {
            username = System.getenv('GITHUB_ACTOR') ?: findProperty('gpr.user')
            password = System.getenv('GPR_TOKEN') ?: findProperty('gpr.key')
        }
    }
}

dependencies {
    implementation "com.nineouting.backend:web-common:${commonVersion}"
    implementation "com.nineouting.backend:api-docs:${commonVersion}"
    implementation "com.nineouting.backend:observability:${commonVersion}"
    // 토큰 검증 부품(필터·401/403 응답·@CurrentUser)만 쓴다. 자동 설정은 jwks-uri가 없어 켜지지 않는다.
    implementation "com.nineouting.backend:security-common:${commonVersion}"
    // 메일 발송 요청 이벤트를 DB 트랜잭션과 함께 기록하고 SNS로 보낸다
    implementation "com.nineouting.backend:outbox:${commonVersion}"

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'   // 프로필 사진 (로컬은 LocalStack)
    implementation 'software.amazon.awssdk:sns'  // 이벤트 보내기 (outbox)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'software.amazon.awssdk:sqs'  // 보낸 이벤트를 테스트 큐로 받아 확인
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 실행 가능한 jar 하나만 만든다 (Dockerfile이 build/libs/*.jar를 복사한다).
tasks.named('jar') {
    enabled = false
}
