# Measurement only: pinned DEV source; no registry publishing, deployment or DEV cache writes.
name: DEV CI current measurement 218
'on':
  pull_request:
    branches:
    - dev
    paths:
    - .github/workflows/dev-ci-measurement-218.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: e4a5b1dc32309ee955f80d14b701d1d73e0f185f
        persist-credentials: false
    - name: Test ECR publish failure paths (offline)
      run: python3 .github/scripts/test_publish_dev_ecr.py
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: true
    - name: Build
      run: ./gradlew build jacocoTestReport --no-daemon --console=plain
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    - name: SonarQube Cloud
      if: env.SONAR_TOKEN != ''
      run: ./gradlew sonar --no-daemon --console=plain
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
    - name: Prepare tested application
      shell: bash
      run: |
        set -euo pipefail
        jars=(build/libs/*.jar)
        if [[ ${#jars[@]} -ne 1 || ! -s "${jars[0]}" ]]; then
          echo '::error::Expected one nonempty executable JAR from the successful build'
          exit 1
        fi
        mkdir -p tested-application
        cp "${jars[0]}" tested-application/app.jar
        (cd tested-application && sha256sum app.jar > app.jar.sha256)
    - name: Save tested application
      uses: actions/upload-artifact@v4
      with:
        name: tested-user-${{ github.run_id }}-${{ github.sha }}
        path: |
          tested-application/app.jar
          tested-application/app.jar.sha256
        if-no-files-found: error
        overwrite: true
        retention-days: 7
    timeout-minutes: 45
    permissions:
      contents: read
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: e4a5b1dc32309ee955f80d14b701d1d73e0f185f
        persist-credentials: false
    - name: Download tested application
      uses: actions/download-artifact@v4
      with:
        name: tested-user-${{ github.run_id }}-${{ github.sha }}
        path: tested-application
    - name: Check tested application
      shell: bash
      run: |
        set -euo pipefail
        cd tested-application
        test -s app.jar
        sha256sum --check app.jar.sha256
    - uses: docker/setup-buildx-action@v3
    - name: Build local image
      uses: docker/build-push-action@v6
      with:
        context: tested-application
        file: Dockerfile.ci
        platforms: linux/amd64
        tags: nineouting-verified:local
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha
        load: true
        push: false
    - name: Clean measurement image
      if: always()
      run: docker image rm nineouting-verified:local || true
    timeout-minutes: 45
