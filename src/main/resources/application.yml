server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: user-service
  config:
    import: classpath:observability/defaults.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/user_db}
    username: ${DB_USERNAME:user_service}
    password: ${DB_PASSWORD:user_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 바꾼다
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

nineouting:
  # 이벤트는 SNS로 보낸다. 자격 증명은 AWS SDK 기본 방식 (EKS는 IRSA, 로컬은 LocalStack)
  messaging:
    region: ${AWS_REGION:ap-northeast-2}
    endpoint: ${AWS_ENDPOINT_URL:}          # 비우면 AWS. 로컬은 LocalStack (http://localhost:4566)
    access-key: ${MESSAGING_ACCESS_KEY:}    # 비우면 AWS 기본 자격 증명. LocalStack은 test
    secret-key: ${MESSAGING_SECRET_KEY:}
  outbox:
    topic-prefix: ${SNS_TOPIC_PREFIX:arn:aws:sns:ap-northeast-2:000000000000:nineouting-local-}
  user:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    jwt:
      private-key: ${JWT_PRIVATE_KEY:}      # RS256 개인키 (PKCS#8 PEM). 운영에서는 반드시 설정
      key-id: ${JWT_KEY_ID:user-service-1}
      access-token-ttl: 30m
      refresh-token-ttl: 14d
      allow-ephemeral-key: false
    storage:                               # 프로필 사진 (S3)
      bucket: ${STORAGE_BUCKET:nineouting-profile-images}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${STORAGE_ENDPOINT:}        # 비우면 AWS S3
      access-key: ${STORAGE_ACCESS_KEY:}    # 비우면 AWS 기본 자격 증명(IAM 역할 등)
      secret-key: ${STORAGE_SECRET_KEY:}
      upload-url-ttl: 5m
      download-url-ttl: 1h
