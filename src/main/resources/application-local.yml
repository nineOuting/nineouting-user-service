# 로컬 개발: HTTPS가 없으므로 쿠키 Secure를 끄고, 개인키가 없으면 임시 키를 만든다.
nineouting:
  messaging:                       # docker-compose의 LocalStack (토픽은 init-sns-sqs.sh가 만든다)
    endpoint: http://localhost:4566
    access-key: test
    secret-key: test
  user:
    refresh-cookie-secure: false
    log-mail-for-local-dev: true   # notification-service 없이 인증 코드·재설정 링크를 로그로 확인
    jwt:
      allow-ephemeral-key: true
    storage:                       # docker-compose의 LocalStack (버킷은 init-s3.sh가 만든다)
      bucket: nineouting-local
      endpoint: http://localhost:4566
      access-key: test
      secret-key: test
